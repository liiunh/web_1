<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    a:link {color:black; text-decoration: none;} /* 하이퍼링크 밑줄 제거 (text-decoration: none;) */
    a:visited {color:black;}
    a:hover {color:red;}
    a:active {background-color:cyan;} /* link ~ active까지 순서 뒤바뀌지 않게 주의하기 */
    *{color:blue;} /* 전체 선택자 */
    h1 {color:red;} /* 태그 선택자 */
    .C1 {background-color:yellow;} /* 클래스 선택자 */
    #I1 {color:green;} /* id 선택자 */
    ol li {background-color:aqua;} /* 하위 선택자 */
</style>
<body>
    <h1>CSS 사용</h1>
    <h2 class="C1"">스타일 사용하기</h2>
    <p>CSS를 이용해서 디자인과 내용을 분리</p>
    <p class="C1">CSS를 이용해서 디자인과 내용을 분리</p>
    <ul>
        <li id="I1">HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ul>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <a href="http://www.syu.ac.kr">삼육대학교</a>
</body>
</html>

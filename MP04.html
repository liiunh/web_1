<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1 { text-align: center;}
    .disp { width: 205px; height: 40px; margin-top: 3px; }
    .disp { text-align: right; font-family: "Oxanium", sans-serif; font-size: 22pt;}
    input[type=button] { width: 50px; height: 50px; margin-top: 5px; text-align: center; vertical-align: middle;}
    .op {background-color: PaleGoldenrod;}
    .func {background-color: PaleGoldenrod;}
    .num {background-color: beige;}
    #calc { width: 220px; margin-left: auto; margin-right: auto;}
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
    $(document).ready(function(){
        $(".num").click(function(){
            let cur = $("#disp2").val();
            let n = $(this).val();
            $("#disp2").val(cur+n);
        });
        $(".func").click(function(){
            $("#disp1").val("");
            $("#disp2").val("");
        });
        $(".op").click(function(){
            let cur = $("#disp2").val();
            let n = $(this).val();
            if (n != "="){
                $("#disp2").val(cur+n);
            }
            else{
                let parts = cur.match(/\d+|[+\-*/]/g);
                // 1. 곱셉과 나눗헴의 계산//
                for (let i=1; i < parts.length; i += 2){
                    let opr = parts[i];
                    //연산자가 곱셉이나 나눗셈이면, 양옆의 숫자를 가져오는 코드//
                    if ( opr === "*" || opr === "/" ){
                        let left = Number(parts[i-1]);
                        let right = Number(parts[i+1]);
                        //0으로 나누려고 하면 안내 메세지 띄우고 계산 중단//
                        if ( opr === "/" && right === 0 ){
                            alert("0으로 나눌 수 없습니다.")
                            return;
                        }
                        //*, / 연산하고 그 값을 result에 저장//
                        let result;
                        if (opr === "*"){
                            result = left * right
                        }
                        else {
                            result = left / right
                        }
                        //*, / 연산자를 수행 한 값을 result에 저장했으니 원래 숫자와 연산자는 지우고 result 값을 배치함.//
                        parts.splice(i-1, 3, result);
                        i -= 2;
                    }
                }
                //2. 남은 +, - 왼쪽부터 계산//
                let result = Number(parts[0]);
                
                for (let i = 1; i < parts.length; i += 2){
                    let opr = parts[i];
                    let opd = Number(parts[i + 1]);
                    
                    if (opr === "+"){
                        result += opd;
                    } else if (opr === "-"){
                        result -= opd;
                    }
                }
                $("#disp1").val(cur);
                $("#disp2").val(result);
            }
        });
    });
</script>
<body>
    <h1>계산기</h1>
    <div id="calc">
        <div>
            <input type="text" class="disp" id="disp1" readonly>
            <input type="text" class="disp" id="disp2">
        </div>
        <input type="button" class="num" value="7">
        <input type="button" class="num" value="8">
        <input type="button" class="num" value="9">
        <input type="button" class="op" value="+"><br>
        <input type="button" class="num" value="4">
        <input type="button" class="num" value="5">
        <input type="button" class="num" value="6">
        <input type="button" class="op" value="-"><br>
        <input type="button" class="num" value="1">
        <input type="button" class="num" value="2">
        <input type="button" class="num" value="3">
        <input type="button" class="op" value="*"><br>
        <input type="button" class="func" value="ac">
        <input type="button" class="num" value="0">
        <input type="button" class="op" value="=">
        <input type="button" class="op" value="/"><br>
    </div>
</body>
</html>
